name: Native XNU ARM64
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-xnu
  cancel-in-progress: false
jobs:
  build:
    # Standard public-repository runner only; private/paid execution is refused.
    if: github.event.repository.private == false
    runs-on: macos-14
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build original XNU with Apple tools
        run: python3 tools/xnu_native.py --fetch --build
      # No artifact/cache upload: their account-wide quota is unknown. Build
      # failures print bounded diagnostics to the ordinary Actions job log.
