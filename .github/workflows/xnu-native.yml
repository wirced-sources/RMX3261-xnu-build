name: Native XNU ARM64
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native build target (physical target is never executed)
        type: choice
        options: [qemu, ums512hw]
        default: qemu
permissions:
  contents: read
concurrency:
  group: native-xnu
  cancel-in-progress: false
jobs:
  build:
    # Standard public-repository runner only; private/paid execution is refused.
    if: github.event.repository.private == false
    runs-on: macos-14
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      XNU_BUILD_TARGET: ${{ inputs.target || 'qemu' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build original XNU with Apple tools
        run: python3 tools/xnu_native.py --fetch --build --target "$XNU_BUILD_TARGET"
      - name: Prepare pinned QEMU host
        if: always() && inputs.target != 'ums512hw'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          if [ -f out/native/report/kernel-audit.json ]; then
            python3 tools/qemu_host.py
          else
            echo 'QEMU host NOT BUILT: native kernel has not passed its strict audit'
          fi
      - name: Verify architectural PAN and instruction clock on owned QEMU fixture
        if: always() && inputs.target != 'ums512hw'
        run: |
          if [ -f out/native/report/kernel-audit.json ]; then
            python3 tools/qemu_clock_probe.py --qemu "$PWD/out/native/qemu-host/build/qemu-system-aarch64" --clang "$(xcrun --find clang)"
          fi
      - name: Execute the audited native kernel in QEMU
        if: always() && inputs.target != 'ums512hw'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_ANALYTICS: 1
        run: |
          if [ -f out/native/report/kernel-audit.json ]; then
            QEMU_BIN="$PWD/out/native/qemu-host/build/qemu-system-aarch64"
            "$QEMU_BIN" --version
            XNU_BOOT_STATUS=0
            for XNU_BOOT_TRIAL in 1 2; do
              python3 tools/xnu_kernel_qemu.py out/native/report/kernel.development.ums512.macho --record out/native/report/kernel-audit.json --userspace-manifest out/native/report/userspace.json --out "out/native/kernel-qemu-$XNU_BOOT_TRIAL" --qemu "$QEMU_BIN" --clang "$(xcrun --find clang)" 2>&1 || XNU_BOOT_STATUS=1
            done
            exit "$XNU_BOOT_STATUS"
          else
            echo 'QEMU NOT RUN: native kernel has not passed its strict audit'
          fi
      - name: Retain audited physical kernel and provenance
        if: always() && inputs.target == 'ums512hw' && hashFiles('out/native/report/kernel-audit.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ums512hw-kernel-${{ github.sha }}
          path: |
            out/native/report/kernel.development.ums512hw.macho
            out/native/report/kernel-audit.json
            out/native/report/code-signing-config.json
            out/native/report/object-inventory.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
